      q('[data-note]').textContent=`表面点云来自模型采样，非扫描真值；附近稀疏点 ${d.landmarkNear.filter(Boolean).length}/${d.landmarks.length}。视锥显示尺度缩短，姿态不变。`;
    }
    time.addEventListener('input',()=>{frame=+time.value;draw();});time.addEventListener('change',save);view.addEventListener('change',()=>{zoom=1;draw();save();});[showModel,showLand,showAll].forEach(x=>x.addEventListener('change',()=>{draw();save();}));
    play.addEventListener('click',()=>{playing=!playing;play.textContent=playing?'暂停':'播放';last=0;if(playing)requestAnimationFrame(tick);else save();});
    function tick(t){if(!playing)return;if(!last)last=t;if(t-last>=1000/30){frame++;last=t;if(frame>222){frame=222;playing=false;play.textContent='播放';save();}draw();}if(playing)requestAnimationFrame(tick);}
    canvas.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-drag[0])*.008;elev=Math.max(-1.4,Math.min(1.4,elev+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];draw();});canvas.addEventListener('pointerup',()=>{drag=null;save();});canvas.addEventListener('pointercancel',()=>{drag=null;});canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.25,Math.min(8,zoom*Math.exp(-e.deltaY*.001)));draw();save();},{passive:false});
    new ResizeObserver(draw).observe(canvas);new MutationObserver(()=>{palette();draw();}).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{palette();draw();});draw();
  })();
  </script>
</div>
